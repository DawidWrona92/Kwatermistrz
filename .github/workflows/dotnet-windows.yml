name: Kwatermistrz — build i testy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Kompilacja WPF i testy Core (.NET 10)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Kwatermistrz.slnx

      - name: Build (Release)
        run: dotnet build Kwatermistrz.slnx --configuration Release --no-restore

      - name: Testy Core
        run: dotnet test tests/Kwatermistrz.Core.Tests/Kwatermistrz.Core.Tests.csproj --configuration Release --no-build


      - name: Publikuj gotową aplikację Windows x64 (bez wymagania .NET)
        run: >
          dotnet publish src/Kwatermistrz.App/Kwatermistrz.App.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=false -p:PublishTrimmed=false
          --output dist/Kwatermistrz

      - name: Dodaj instrukcję do paczki testowej
        shell: pwsh
        run: |
          @'
          Kwatermistrz — wersja testowa Windows 64-bit
          
          1. Rozpakuj cały pobrany artefakt do osobnego folderu.
          2. Uruchom Kwatermistrz.exe (nie przenoś samego EXE).
          3. Nie musisz instalować Visual Studio ani .NET SDK.
          
          UWAGA: Aplikacja korzysta ze zwykłego katalogu danych:
          %APPDATA%\Kwatermistrz
          
          PRZED URUCHOMIENIEM wykonaj kopię CAŁEGO tego katalogu,
          łącznie z dane.json, kopią zapasową i zdjęciami.
          To build testowy PR, nie wydanie stabilne.
          
          Wyprawy 1.1 i Import 1.2 — wymagają ręcznej akceptacji.
          Instrukcje testów są w docs/testy-wypraw-1.1.md
          i docs/testy-import-1.2.md w repozytorium.
          '@ | Set-Content -Path dist/Kwatermistrz/PRZECZYTAJ-PRZED-STARTEM.txt -Encoding UTF8

      - name: Udostępnij paczkę Kwatermistrz Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: Kwatermistrz-Windows-x64-TEST
          path: dist/Kwatermistrz/
          if-no-files-found: error
          retention-days: 30
