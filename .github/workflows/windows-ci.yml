name: Windows build, tests and import/UI smoke test

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Kwatermistrz.slnx

      - name: Build application and core
        run: dotnet build Kwatermistrz.slnx -c Release --no-restore

      - name: Run core tests
        run: dotnet test tests/Kwatermistrz.Core.Tests/Kwatermistrz.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Publish self-contained Windows folder
        shell: pwsh
        run: |
          dotnet publish src/Kwatermistrz.App/Kwatermistrz.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o "$env:RUNNER_TEMP\kwatermistrz"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate all XAML views on Windows
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "kwatermistrz\Kwatermistrz.exe"
          $sample = Join-Path $env:GITHUB_WORKSPACE "docs\dane-startowe\Dane_zrodlowe_Kwatermistrz.xlsx"
          if (-not (Test-Path $sample)) { throw "Missing sample workbook: $sample" }
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test `"$sample`"" -PassThru
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id -Force
            throw "Smoke test timed out"
          }
          if ($process.ExitCode -ne 0) {
            $log = Join-Path $env:APPDATA "Kwatermistrz\error.log"
            if (Test-Path $log) { Get-Content $log -Tail 200 }
            throw "XAML smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Package portable application
        shell: pwsh
        run: |
          Copy-Item docs/instalacja/INSTRUKCJA.txt "$env:RUNNER_TEMP\kwatermistrz\"
          Compress-Archive -Path "$env:RUNNER_TEMP\kwatermistrz" -DestinationPath "$env:RUNNER_TEMP\Kwatermistrz-win-x64.zip"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: tests/Kwatermistrz.Core.Tests/TestResults/*.trx
          if-no-files-found: ignore

      - name: Upload validated portable app
        uses: actions/upload-artifact@v4
        with:
          name: Kwatermistrz-win-x64
          path: ${{ runner.temp }}\\Kwatermistrz-win-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release for a version tag
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kwatermistrz-win-x64
          path: release
      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/Kwatermistrz-win-x64.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release/Kwatermistrz-win-x64.zip --repo "$GITHUB_REPOSITORY" --title "Kwatermistrz $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
